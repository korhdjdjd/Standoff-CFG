<!DOCTYPE html>
<!--
SO2 CFG — настройка Supabase

1) Создай проект на https://supabase.com.
2) В Project Settings → API скопируй Project URL и publishable key (или legacy anon key).
3) В блоке «SUPABASE» ниже вставь их в SUPABASE_URL и SUPABASE_ANON_KEY.
4) В Supabase → SQL Editor выполни SQL ниже. Перед этим создай пользователя-владельца
   в Authentication → Users (или зарегистрируйся через Sign up), затем скопируй его UUID.
   В SQL замени OWNER_UUID на UUID этого пользователя.
5) В Authentication → Providers включи Email. Открой сайт и быстро нажми 7 раз на нижнюю
   надпись SO2 CFG, затем войди по email и паролю пользователя-владельца.

SQL ДЛЯ SUPABASE (замени OWNER_UUID на UUID владельца):

create table if not exists public.so2_data (
  id integer primary key check (id = 1),
  data jsonb not null default '{"players":[],"teams":[],"guides":[],"ads":[]}'::jsonb
);
alter table public.so2_data enable row level security;
grant select on public.so2_data to anon, authenticated;
grant insert, update on public.so2_data to authenticated;
drop policy if exists "Public can read SO2 data" on public.so2_data;
create policy "Public can read SO2 data" on public.so2_data for select to anon, authenticated using (true);
drop policy if exists "Owner can insert SO2 data" on public.so2_data;
create policy "Owner can insert SO2 data" on public.so2_data for insert to authenticated
  with check (auth.uid() = 'OWNER_UUID'::uuid);
drop policy if exists "Owner can update SO2 data" on public.so2_data;
create policy "Owner can update SO2 data" on public.so2_data for update to authenticated
  using (auth.uid() = 'OWNER_UUID'::uuid) with check (auth.uid() = 'OWNER_UUID'::uuid);

create table if not exists public.so2user (
  id text primary key,
  payload jsonb not null,
  created_at timestamptz not null default now()
);
alter table public.so2user enable row level security;
grant select, insert on public.so2user to anon, authenticated;
grant delete on public.so2user to authenticated;
drop policy if exists "Public can read user submissions" on public.so2user;
create policy "Public can read user submissions" on public.so2user for select to anon, authenticated using (true);
drop policy if exists "Anyone can publish user submissions" on public.so2user;
create policy "Anyone can publish user submissions" on public.so2user for insert to anon, authenticated with check (true);
drop policy if exists "Owner can delete user submissions" on public.so2user;
create policy "Owner can delete user submissions" on public.so2user for delete to authenticated
  using (auth.uid() = 'OWNER_UUID'::uuid);

Важно: используй только publishable/anon key в HTML. service_role key нельзя публиковать.
Пользовательские прицелы и конфиги хранятся в таблице so2user; общие данные сайта — в so2_data.
-->

function crossSvg(p){const n=k=>parseFloat(String(p[k]??'').replace(',','.'))||0,K=1.2,t=Math.min(n('thick'),12)*K,l=Math.min(n('len'),30)*K,g=Math.min(n('gap'),30)*K,c=h6(p.color)||'#ffffff';
 if(!t||!l)return'';const m=80,h=t/2;
 return`<svg viewBox="0 0 160 160" shape-rendering="crispEdges"><g fill="${c}"><rect x="${m-g-l}" y="${m-h}" width="${l}" height="${t}"/><rect x="${m+g}" y="${m-h}" width="${l}" height="${t}"/><rect x="${m-h}" y="${m-g-l}" width="${t}" height="${l}"/><rect x="${m-h}" y="${m+g}" width="${t}" height="${l}"/></g></svg>`}

 const b={tg:'https://t.me/',yt:'https://youtube.com/@',tt:'https://tiktok.com/@',ig:'https://instagram.com/',vk:'https://vk.com/',tw:'https://twitch.tv/'}[s.n];return b?b+encodeURIComponent(u.replace(/^@/,'')):''}

function avEd(m,o,ph){const box=m.querySelector('#ae');
 const lim=()=>((o.z||100)/100-1)*50,cl=v=>Math.max(-lim(),Math.min(lim(),v));
 const apply=()=>{o.ox=cl(o.ox||0);o.oy=cl(o.oy||0);const i=box.querySelector('#fr img');if(i)i.style.cssText=tf(o)};
 const zoom=d=>{o.z=Math.max(100,Math.min(400,(o.z||100)+d));apply()};
 const draw=()=>{
  box.innerHTML=`<div class="fw"><div id="fr">${av({...o,nick:ph(),name:ph()},'xl')}</div>
  <div class="hint">${o.img?'Тяни фото пальцем или мышкой · колесо или щипок меняют масштаб':'Загрузи фото, потом настрой его прямо здесь'}</div>
  <div class="ctl"><button class="btn" id="up" type="button">${o.img?'Другое фото':'Загрузить фото'}</button>${o.img?'<button class="ib" id="zm" type="button">−</button><button class="ib" id="zp" type="button">+</button><button class="ib" id="rs" type="button">Сброс</button><button class="ib dg" id="rm" type="button">Убрать</button>':''}<input type="file" id="fi" accept="image/*" hidden></div>
  <div class="ctl">${[['c','Круг'],['r','Скругл.'],['s','Квадрат']].map(([k,l])=>`<button class="chip${(o.sh||'r')===k?' on':''}" data-sh="${k}" type="button">${l}</button>`).join('')}<span class="hint">Рамка</span><input type="color" id="rc" value="${o.ring||'#24242c'}">${o.ring?'<button class="ib" id="rr" type="button">✕</button>':''}</div></div>`;
  const fr=box.querySelector('#fr'),ps=new Map();let pd=0;
  const dist=()=>{if(ps.size<2)return 0;const a=[...ps.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
  fr.onpointerdown=e=>{if(!o.img)return;fr.setPointerCapture(e.pointerId);ps.set(e.pointerId,[e.clientX,e.clientY]);pd=dist()};
  fr.onpointermove=e=>{const pr=ps.get(e.pointerId);if(!pr)return;const w=fr.offsetWidth;ps.set(e.pointerId,[e.clientX,e.clientY]);
   if(ps.size===1){o.ox=(o.ox||0)+(e.clientX-pr[0])/w*100;o.oy=(o.oy||0)+(e.clientY-pr[1])/w*100}
   else{const d=dist();if(pd)o.z=Math.max(100,Math.min(400,(o.z||100)*d/pd));pd=d}
   apply()};
  fr.onpointerup=fr.onpointercancel=e=>{ps.delete(e.pointerId);pd=dist()};
  fr.onwheel=e=>{if(!o.img)return;e.preventDefault();zoom(e.deltaY<0?8:-8)};
  box.querySelector('#up').onclick=()=>box.querySelector('#fi').click();
  box.querySelector('#fi').onchange=async e=>{if(e.target.files[0]){const v=await img(e.target.files[0]);if(v){o.img=v;o.z=100;o.ox=0;o.oy=0}draw()}};
  box.querySelector('#zm')?.addEventListener('click',()=>zoom(-10));box.querySelector('#zp')?.addEventListener('click',()=>zoom(10));
  box.querySelector('#rs')?.addEventListener('click',()=>{o.z=100;o.ox=0;o.oy=0;apply()});
  box.querySelector('#rm')?.addEventListener('click',()=>{o.img='';draw()});
  box.querySelectorAll('[data-sh]').forEach(e=>e.onclick=()=>{o.sh=e.dataset.sh;draw()});
  box.querySelector('#rc').oninput=e=>{o.ring=e.target.value;fr.querySelector('.av').style.borderColor=o.ring};
  box.querySelector('#rc').onchange=draw;
  box.querySelector('#rr')?.addEventListener('click',()=>{o.ring='';draw()});
 };draw();

  if(!r.ok){rClear();isOwner=false;render();return''}rSet(await r.json())}
 return R.tok}
async function rLogin(email,pw){let r;try{r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{method:'POST',headers:sbHeaders(),body:JSON.stringify({email,password:pw})})}catch(e){throw new Error('Сетевая ошибка (Failed to fetch). Проверь доступ к Supabase, URL проекта и блокировщики/сеть.')}let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error((j.msg||j.message||j.error_description||j.error||'HTTP '+r.status)+' [HTTP '+r.status+']');rSet(j);isOwner=true}
function rLogout(){rClear();isOwner=false;render();toast('Режим владельца выключен')}
async function rGet(){const r=await fetch(dbu()+'?id=eq.1&select=data',{headers:sbHeaders(),cache:'no-store'});if(!r.ok)throw new Error('get');const j=await r.json();return j&&j[0]?j[0].data:null}
async function rSave(){const t=await rTok();if(!t)throw new Error('auth');
 COLS.forEach(c=>(D[c]||[]).forEach(x=>{if(!x._o)x._o=Date.now()+Math.random()}));
 const payload={players:D.players,teams:D.teams,guides:D.guides,ads:D.ads};
 const r=await fetch(dbu(),{method:'POST',headers:sbHeaders(t,{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({id:1,data:payload})});if(!r.ok)throw new Error('put '+r.status);last=snap(D)}
async function rBoot(){if(!R.on)return;
 try{const a=JSON.parse(localStorage.getItem('so2auth')||'null');if(a&&a.rt){R.rt=a.rt;if(await rTok())isOwner=true}}catch(e){}
 try{const j=await rGet();if(j){COLS.forEach(c=>D[c]=Array.isArray(j[c])?j[c]:[]);last=snap(D)}else if(isOwner){await rSave()}}catch(e){toast('База данных недоступна')}
 render();clearInterval(pollT);pollT=setInterval(rPoll,60000)}
async function rPoll(){if(document.hidden||saving||dirty||document.querySelector('.ov'))return;
 try{const j=await rGet();if(!j)return;const n={};COLS.forEach(c=>n[c]=Array.isArray(j[c])?j[c]:[]);const sn=snap(n);if(JSON.stringify(sn)===JSON.stringify(last))return;COLS.forEach(c=>D[c]=n[c]);last=sn;render()}catch(e){}}
function loginForm(){const m=modal(`<h2>Вход владельца</h2><label>Email</label><input class="in" id="le" type="email" autocomplete="username"><label>Пароль</label><input class="in" id="lp" type="password" autocomplete="current-password"><div class="hint" id="lm" style="text-align:left;margin-top:8px"></div><div class="acts"><button class="btn pri" id="ok">Войти</button><button class="btn" id="no">Отмена</button></div>`);
 m.querySelector('#no').onclick=closeM;
 const go=async()=>{try{await rLogin(m.querySelector('#le').value.trim(),m.querySelector('#lp').value);closeM();render();toast('Режим владельца включён')}catch(e){m.querySelector('#lm').textContent='Ошибка входа: '+(e.message||'проверь email и пароль')}};
 m.querySelector('#ok').onclick=go;m.querySelector('#lp').onkeydown=e=>{if(e.key==='Enter')go()}}
const GHS={on:!!GH_REPO&&!(DB_URL&&API_KEY),tok:'',sha:''};
const ghApi=()=>'https://api.github.com/repos/'+GH_REPO+'/contents/'+GH_PATH;
const b64=str=>{const u=new TextEncoder().encode(str);let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t)};
const ghH=()=>({'Authorization':'Bearer '+GHS.tok,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
async function ghSha(){const r=await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/?ref='+GH_BRANCH,{headers:ghH(),cache:'no-store'});if(!r.ok)throw new Error('sha');const l=await r.json();const f=Array.isArray(l)?l.find(x=>x.name===GH_PATH):null;return f?f.sha:''}
async function ghSave(){const body=JSON.stringify({players:D.players,teams:D.teams,guides:D.guides,ads:D.ads});
 const put=sha=>fetch(ghApi(),{method:'PUT',headers:{...ghH(),'Content-Type':'application/json'},body:JSON.stringify({message:'update data',content:b64(body),branch:GH_BRANCH,...(sha?{sha}:{})})});
 if(!GHS.sha)GHS.sha=await ghSha();
 let r=await put(GHS.sha);
 if(r.status===409||r.status===422){GHS.sha=await ghSha();r=await put(GHS.sha)}
 if(!r.ok)throw new Error('put '+r.status);GHS.sha=(await r.json()).content.sha}
async function ghMedia(f){const ext=((f.name||'').split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin',path='media/'+uid()+'.'+ext;
 const u=new Uint8Array(await f.arrayBuffer());let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
 if(!GHS.tok)throw new Error('auth');
 const r=await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+path,{method:'PUT',headers:{...ghH(),'Content-Type':'application/json'},body:JSON.stringify({message:'add media',content:btoa(t),branch:GH_BRANCH})});
 if(!r.ok)throw new Error('gh '+r.status);return path}
async function ghRead(){let r;
 if(GHS.tok)r=await fetch(ghApi()+'?ref='+GH_BRANCH,{headers:{...ghH(),'Accept':'application/vnd.github.raw+json'},cache:'no-store'});
 else r=await fetch(GH_PATH+'?t='+Date.now(),{cache:'no-store'});
 if(!r.ok)return null;try{return await r.json()}catch(e){return null}}
const ghApply=j=>{if(!j)return false;let ok=false;COLS.forEach(c=>{if(Array.isArray(j[c])){D[c]=j[c];ok=true}});return ok};
async function ghBoot(){if(!GHS.on)return;
 try{const a=JSON.parse(localStorage.getItem('so2gh')||'null');if(a&&a.t){GHS.tok=a.t;isOwner=true}}catch(e){}
 try{ghApply(await ghRead())}catch(e){}
 render();
 setInterval(async()=>{if(GHS.tok||document.hidden||document.querySelector('.ov'))return;
  try{const j=await ghRead();if(!j)return;if(JSON.stringify([j.players,j.teams,j.guides,j.ads])===JSON.stringify([D.players,D.teams,D.guides,D.ads]))return;ghApply(j);render()}catch(e){}},60000)}
function ghLogin(){const m=modal(`<h2>Вход владельца</h2><div class="hint" style="text-align:left;margin-bottom:8px">Вставь токен GitHub с правом записи в репозиторий ${esc(GH_REPO)}. Он сохранится только в этом браузере.</div><input class="in" id="gt" type="password" placeholder="github_pat_..." autocomplete="off"><div class="hint" id="lm" style="text-align:left;margin-top:8px"></div><div class="acts"><button class="btn pri" id="ok">Войти</button><button class="btn" id="no">Отмена</button></div>`);
 m.querySelector('#no').onclick=closeM;
 const go=async()=>{const t=m.querySelector('#gt').value.trim();if(!t)return;GHS.tok=t;
  try{GHS.sha=await ghSha();try{localStorage.setItem('so2gh',JSON.stringify({t}))}catch(e){}isOwner=true;closeM();
   try{ghApply(await ghRead())}catch(e){}render();toast('Режим владельца включён')}
  catch(e){GHS.tok='';m.querySelector('#lm').textContent='Токен не подошёл или нет доступа к репозиторию'}};
 m.querySelector('#ok').onclick=go;m.querySelector('#gt').onkeydown=e=>{if(e.key==='Enter')go()}}
function ghLogout(){GHS.tok='';GHS.sha='';try{localStorage.removeItem('so2gh')}catch(e){}isOwner=false;render();toast('Режим владельца выключен')}
let LOCAL=!R.on&&!GHS.on&&typeof claude==='undefined';
function localInit(){try{const j=JSON.parse(localStorage.getItem('so2data')||'null');if(j)COLS.forEach(c=>{if(Array.isArray(j[c]))D[c]=j[c]});if(localStorage.getItem('so2own')==='1')isOwner=true}catch(e){}}
if(LOCAL)localInit();
function dlFile(){const c=document.documentElement.cloneNode(true);
 c.querySelector('#app').innerHTML='';c.querySelector('#ad').innerHTML='';c.querySelector('#own').innerHTML='';c.querySelector('#ct').textContent='';
 c.querySelectorAll('.ov,.dov,.toast,.lb,#sv,#fab').forEach(e=>e.remove());c.classList.remove('lock');c.querySelector('body').className='';
 c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
 const pre=[...document.childNodes].filter(n=>n.nodeType===8).map(n=>'<!--'+n.data+'-->').join('\n');
 const b=new Blob(['<!DOCTYPE html>\n'+pre+'\n'+c.outerHTML],{type:'text/html'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='index.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Файл скачан')}
let tapN=0,tapT=0;
function secretTap(){const now=Date.now();tapN=now-tapT>1500?1:tapN+1;tapT=now;
 if(tapN<SECRET_TAPS)return;tapN=0;
 if(R.on){R.tok?rLogout():loginForm()}
 else if(GHS.on){GHS.tok?ghLogout():ghLogin()}
 else if(LOCAL){isOwner=!isOwner;try{localStorage.setItem('so2own',isOwner?'1':'0')}catch(e){}render();toast(isOwner?'Режим владельца включён':'Режим владельца выключен')}}
document.querySelector('footer')?.addEventListener('click',secretTap);
setTimeout(subsLoad,300,true);setInterval(()=>{if(!document.hidden&&tab==='user')subsLoad(true)},60000);setTimeout(rBoot,0);setTimeout(ghBoot,0);
render();if(rY)scrollTo({top:rY,behavior:'instant'});setTimeout(()=>document.body.classList.remove('rest'),900);
(async()=>{let u=null;try{u=await claude.use('user')}catch(e){}
if(!u&&!R.on&&!GHS.on&&!LOCAL){LOCAL=true;localInit();render()}
try{isOwner=isOwner||!!(u&&u.isOwner());if(isOwner){art=await claude.use('artifact');try{AS=await claude.use('assets')}catch(e){}}render();if(rY){scrollTo({top:rY,behavior:'instant'});rY=0}}catch(e){}})();
</script>
